<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Liberation Sans', Arial, Helvetica, sans-serif"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3b39"/></marker><marker id="ta" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3b39"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="tr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="hv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="tv" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="tb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b9a6c"/></marker><marker id="tg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b9a6c"/></marker><marker id="ho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0703f"/></marker><marker id="to" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0703f"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="28" font-size="14.5" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="start" dominant-baseline="middle">(a) VVC structure</text><rect x="30" y="50" width="560" height="210" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.4"/><text x="310" y="76" font-size="13" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Reference (human-readable, not secret)</text><rect x="60" y="104" width="105" height="48" rx="6" fill="white" stroke="#2a78d6" stroke-width="1.3"/><text x="112.5" y="128" font-size="17" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">SAVC</text><text x="112.5" y="170" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">issuing system</text><text x="173" y="128" font-size="18" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">–</text><rect x="181" y="104" width="105" height="48" rx="6" fill="white" stroke="#2a78d6" stroke-width="1.3"/><text x="233.5" y="128" font-size="17" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">2026</text><text x="233.5" y="170" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">year</text><text x="294" y="128" font-size="18" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">–</text><rect x="302" y="104" width="105" height="48" rx="6" fill="white" stroke="#2a78d6" stroke-width="1.3"/><text x="354.5" y="128" font-size="17" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">ACC</text><text x="354.5" y="170" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">message type</text><text x="415" y="128" font-size="18" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">–</text><rect x="423" y="104" width="125" height="48" rx="6" fill="white" stroke="#2a78d6" stroke-width="1.3"/><text x="485.5" y="128" font-size="17" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">45789</text><text x="485.5" y="170" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">message ID</text><text x="310" y="214.41" font-size="11.5" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">locates the record in the venue registry;</text><text x="310" y="229.59" font-size="11.5" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">can be read over the phone or typed by the author</text><text x="615" y="155" font-size="30" font-weight="bold" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">+</text><rect x="640" y="50" width="730" height="210" rx="10" fill="#f1effc" stroke="#6250d6" stroke-width="1.4"/><text x="1005" y="76" font-size="13" font-weight="bold" font-style="normal" fill="#45389e" text-anchor="middle" dominant-baseline="middle">Authenticator (secret-key protected, ≥ 128-bit security)</text><rect x="665" y="100" width="300" height="56" rx="6" fill="white" stroke="#6250d6" stroke-width="1.3"/><text x="815" y="120.08" font-size="12" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">HMAC-SHA256(K_rep, m)</text><text x="815" y="135.92" font-size="12" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">or EdDSA signature over m</text><path d="M 985,128 L 967,128" fill="none" stroke="#6250d6" stroke-width="1.5" marker-end="url(#hv)"/><rect x="995" y="102" width="168" height="28" rx="14" fill="white" stroke="#b9b2ee" stroke-width="1.1"/><text x="1079" y="116" font-size="11" font-weight="normal" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">venue ID</text><rect x="1175" y="102" width="168" height="28" rx="14" fill="white" stroke="#b9b2ee" stroke-width="1.1"/><text x="1259" y="116" font-size="11" font-weight="normal" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">representative ID</text><rect x="995" y="136" width="168" height="28" rx="14" fill="white" stroke="#b9b2ee" stroke-width="1.1"/><text x="1079" y="150" font-size="11" font-weight="normal" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">recipient address</text><rect x="1175" y="136" width="168" height="28" rx="14" fill="white" stroke="#b9b2ee" stroke-width="1.1"/><text x="1259" y="150" font-size="11" font-weight="normal" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">message type</text><rect x="995" y="170" width="168" height="28" rx="14" fill="white" stroke="#b9b2ee" stroke-width="1.1"/><text x="1079" y="184" font-size="11" font-weight="normal" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">SHA-256(message)</text><rect x="1175" y="170" width="168" height="28" rx="14" fill="white" stroke="#b9b2ee" stroke-width="1.1"/><text x="1259" y="184" font-size="11" font-weight="normal" font-style="normal" fill="#1f1f1e" text-anchor="middle" dominant-baseline="middle">expiry time</text><text x="1170" y="222" font-size="11.5" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">m = canonical encoding of the six bound fields</text><text x="815" y="186" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">tag verified with the key recorded in the ledger</text><text x="30" y="312" font-size="14.5" font-weight="bold" font-style="normal" fill="#1f1f1e" text-anchor="start" dominant-baseline="middle">(b) Validation pipeline (each check rejects the attack classes shown)</text><rect x="30" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="48" cy="363" r="10" fill="#2a78d6"/><text x="48" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">1</text><text x="124.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Record lookup</text><text x="114.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">reference exists,</text><text x="114.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">not revoked</text><path d="M 114.0,459 L 114.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="44" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="114.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects A2</text><path d="M 200,401 L 218,401" fill="none" stroke="#3b3b39" stroke-width="1.5" marker-end="url(#ha)"/><rect x="220" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="238" cy="363" r="10" fill="#2a78d6"/><text x="238" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">2</text><text x="314.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Binding</text><text x="304.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">recipient and type</text><text x="304.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">match</text><path d="M 304.0,459 L 304.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="234" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="304.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects A4</text><path d="M 390,401 L 408,401" fill="none" stroke="#3b3b39" stroke-width="1.5" marker-end="url(#ha)"/><rect x="410" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="428" cy="363" r="10" fill="#2a78d6"/><text x="428" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">3</text><text x="504.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Content digest</text><text x="494.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">SHA-256 of received</text><text x="494.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">message matches</text><path d="M 494.0,459 L 494.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="424" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="494.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects A6</text><path d="M 580,401 L 598,401" fill="none" stroke="#3b3b39" stroke-width="1.5" marker-end="url(#ha)"/><rect x="600" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="618" cy="363" r="10" fill="#2a78d6"/><text x="618" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">4</text><text x="694.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Validity window</text><text x="684.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">verification time</text><text x="684.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">≤ expiry</text><path d="M 684.0,459 L 684.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="614" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="684.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects A5</text><path d="M 770,401 L 788,401" fill="none" stroke="#3b3b39" stroke-width="1.5" marker-end="url(#ha)"/><rect x="790" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="808" cy="363" r="10" fill="#2a78d6"/><text x="808" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">5</text><text x="884.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Key status</text><text x="874.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">signing key active</text><text x="874.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">in ledger</text><path d="M 874.0,459 L 874.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="804" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="874.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects revoked keys</text><path d="M 960,401 L 978,401" fill="none" stroke="#3b3b39" stroke-width="1.5" marker-end="url(#ha)"/><rect x="980" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="998" cy="363" r="10" fill="#2a78d6"/><text x="998" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">6</text><text x="1074.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Authenticator</text><text x="1064.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">constant-time</text><text x="1064.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">tag comparison</text><path d="M 1064.0,459 L 1064.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="994" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="1064.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects A3, A7</text><path d="M 1150,401 L 1168,401" fill="none" stroke="#3b3b39" stroke-width="1.5" marker-end="url(#ha)"/><rect x="1170" y="345" width="168" height="112" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.4"/><circle cx="1188" cy="363" r="10" fill="#2a78d6"/><text x="1188" y="363.5" font-size="11.5" font-weight="bold" font-style="normal" fill="white" text-anchor="middle" dominant-baseline="middle">7</text><text x="1264.0" y="364" font-size="12.5" font-weight="bold" font-style="normal" fill="#1c5cab" text-anchor="middle" dominant-baseline="middle">Payment</text><text x="1254.0" y="399.74" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">fee account is a</text><text x="1254.0" y="414.26" font-size="11" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">registered account</text><path d="M 1254.0,459 L 1254.0,505" fill="none" stroke="#d64545" stroke-width="1.3" marker-end="url(#hr)"/><rect x="1184" y="507" width="140" height="30" rx="15" fill="#fdeeee" stroke="#d64545" stroke-width="1.4"/><text x="1254.0" y="522" font-size="11" font-weight="bold" font-style="normal" fill="#b02c2c" text-anchor="middle" dominant-baseline="middle">rejects A8</text><text x="684.0" y="575" font-size="12" font-weight="normal" font-style="normal" fill="#52514e" text-anchor="middle" dominant-baseline="middle">A message is accepted only if all seven checks pass; failures return the reason to the author.</text></svg>